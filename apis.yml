aid: myfitnesspal
name: MyFitnessPal
description: 'MyFitnessPal is a nutrition and fitness tracking platform built around a food diary, calorie
  counting, a large branded-food and barcode database, exercise logging, weight and body measurements,
  and goal setting. Its partner-facing REST API (v2, hosted at api.myfitnesspal.com) lets approved
  applications read and write a consenting user''s diary (food and exercise), body measurements, and
  profile, and subscribe to webhook notifications when that data changes. Access uses OAuth 2.0
  authorization-code grants with the diary, measurements, private-exercises, and subscriptions scopes.
  The developer program is currently closed to new applicants. This profile was surfaced as a portfolio
  lead and enriched by the API Evangelist pipeline.'
